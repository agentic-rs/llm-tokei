    [data-svg-stroke="cyan"] { stroke: var(--svg-cyan); }
    [data-svg-fill="yellow"] { fill: var(--svg-yellow); }
    [data-svg-stroke="yellow"] { stroke: var(--svg-yellow); }
    [data-svg-fill="dim"] { fill: var(--svg-dim); }
    [data-svg-stroke="dim"] { stroke: var(--svg-dim); }
