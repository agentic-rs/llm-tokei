name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "npm/model-catalog/**"
      - "npm/model-price-history/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PRICE_HISTORY_MANIFEST_URL: https://agentic.tokn-ai.dev/llm-tokei/models/manifest.json
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - name: Select models.dev cache generation
        id: models_dev_cache_key
        working-directory: .
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore models.dev Git objects
        uses: actions/cache@v4
        with:
          path: .cache/models.dev.git
          key: models-dev-git-${{ runner.os }}-${{ steps.models_dev_cache_key.outputs.week }}
          restore-keys: |
            models-dev-git-${{ runner.os }}-
      - name: Update models.dev repository
        working-directory: .
        run: |
          repository_path=".cache/models.dev.git"
          repository_url="https://github.com/anomalyco/models.dev.git"
          mkdir -p .cache
          if git -C "$repository_path" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$repository_path" remote set-url origin "$repository_url"
            if ! git -C "$repository_path" fetch --prune origin \
              "+refs/heads/dev:refs/heads/dev"; then
              rm -rf "$repository_path"
            fi
          fi
          if ! git -C "$repository_path" rev-parse --git-dir >/dev/null 2>&1; then
            git clone --bare --branch dev --single-branch \
              "$repository_url" "$repository_path"
          fi
          test "$(git -C "$repository_path" rev-parse --is-shallow-repository)" = "false"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            npm/model-price-history/pnpm-lock.yaml
            site/pnpm-lock.yaml
      - uses: actions/configure-pages@v6
      - name: Install price history dependencies
        working-directory: npm/model-price-history
        run: pnpm install --frozen-lockfile
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve data generator revisions
        id: price_history_generator
        working-directory: .
        run: |
          echo "revision=$(git rev-parse HEAD:npm/model-price-history)" >> "$GITHUB_OUTPUT"
          echo "catalog_revision=$(git rev-parse HEAD:npm/model-catalog)" >> "$GITHUB_OUTPUT"
      - name: Restore deployed price history
        id: price_history_base
        working-directory: .
        env:
          GENERATOR_REVISION: ${{ steps.price_history_generator.outputs.revision }}
        run: |
          node site/scripts/restore-price-history-base.mjs \
            --manifest-url "$PRICE_HISTORY_MANIFEST_URL" \
            --generator-revision "$GENERATOR_REVISION" \
            --source-repository "https://github.com/anomalyco/models.dev" \
            --source-ref dev \
            --output-directory ".cache/price-history-base"
      - name: Generate price history artifact
        working-directory: .
        env:
          BASE_AVAILABLE: ${{ steps.price_history_base.outputs.available }}
          BASE_COMMIT_SHA: ${{ steps.price_history_base.outputs.base_commit_sha }}
          BASE_CSV_PATH: ${{ steps.price_history_base.outputs.base_csv_path }}
          CATALOG_REVISION: ${{ steps.price_history_generator.outputs.catalog_revision }}
          GENERATOR_REVISION: ${{ steps.price_history_generator.outputs.revision }}
        run: |
          pnpm --dir npm/model-price-history build
          source_commit=$(git -C .cache/models.dev.git rev-parse dev)
          base_arguments=()
          if [[ "$BASE_AVAILABLE" == "true" ]]; then
            base_arguments+=(
              --base-csv "$BASE_CSV_PATH"
              --base-commit "$BASE_COMMIT_SHA"
            )
          fi
          price_csv=$(node npm/model-price-history/dist/cli.js changes \
            --repo .cache/models.dev.git \
            --ref "$source_commit" \
            --out-dir site/public/models \
            "${base_arguments[@]}")
          families_csv=$(node npm/model-price-history/dist/cli.js families \
            --repo .cache/models.dev.git \
            --ref "$source_commit" \
            --out-dir site/public/models)
          node site/scripts/write-price-history-manifest.mjs \
            --csv "$price_csv" \
            --families-csv "$families_csv" \
            --catalog-revision "$CATALOG_REVISION" \
            --generator-revision "$GENERATOR_REVISION" \
            --source-repository "https://github.com/anomalyco/models.dev" \
            --source-ref dev
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - name: Prepare custom-domain artifact
        run: |
          mkdir -p pages/llm-tokei
          cp -R pages-root/. pages/
          cp -R dist/. pages/llm-tokei/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
